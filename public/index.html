<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EventSnap — poster to calendar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237b1e3a'/><rect x='7' y='9' width='18' height='16' rx='2' fill='white'/><rect x='7' y='9' width='18' height='5' fill='%23f3b33d'/></svg>" />
<style>
  :root {
    --bg: #f6f4f1; --card: #ffffff; --ink: #1d1b1a; --muted: #6b6560; --line: #e5e0da;
    --accent: #7b1e3a; --accent-soft: #f6e9ed; --gold: #f3b33d; --ok: #2f7d4f; --warn: #a15c00; --warn-soft: #fff4e0;
    --radius: 14px; --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
  header { display: flex; align-items: center; gap: 12px; padding: 18px 28px; border-bottom: 1px solid var(--line); background: var(--card); }
  header .logo { width: 34px; height: 34px; }
  header h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  header .status { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: #eee; color: var(--muted); white-space: nowrap; }
  .chip.on { background: #e5f2ea; color: var(--ok); }
  .chip.off { background: var(--warn-soft); color: var(--warn); }
  main { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 22px; padding: 22px 28px 40px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 14px 16px; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .drop { border: 2px dashed #d6cfc7; border-radius: 12px; min-height: 260px; display: grid; place-items: center; text-align: center; cursor: pointer; transition: .15s; background: #fbfaf8; overflow: hidden; position: relative; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop img { max-width: 100%; max-height: 460px; display: block; }
  .drop .hint { color: var(--muted); padding: 24px; }
  .drop .hint b { color: var(--ink); display: block; font-size: 16px; margin-bottom: 4px; }
  .how { color: var(--muted); font-size: 13px; margin: 14px 0; }
  .speed { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 14px; }
  .speed button { background: #fbfaf8; border: 1px solid var(--line); color: var(--ink); padding: 8px 6px; flex-direction: column; gap: 0; font-size: 14px; }
  .speed button small { font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .speed button.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .primary { background: var(--accent); color: white; }
  .primary:disabled { opacity: .45; cursor: not-allowed; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .ghost:hover { border-color: var(--accent); }
  .gold { background: var(--gold); color: #3b2a00; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .fields .full { grid-column: 1 / -1; }
  label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  label.f input { font: inherit; font-size: 15px; color: var(--ink); padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: white; font-weight: 400; }
  label.f input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  label.f.flag input { border-color: #e6b566; background: var(--warn-soft); }
  .warn { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin: 0 0 14px; }
  .warn li { margin-left: 16px; }
  .ok { background: #e5f2ea; color: var(--ok); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin: 0 0 14px; }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; margin-top: 14px; }
  .meta b { color: var(--ink); font-weight: 600; }
  details { margin-top: 14px; font-size: 13px; }
  details pre { white-space: pre-wrap; background: #faf8f6; border: 1px solid var(--line); border-radius: 9px; padding: 10px; max-height: 260px; overflow: auto; font-size: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }
  .empty .big { font-size: 40px; }
  .err { background: #fde8e8; color: #9b1c1c; border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 13.5px; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: white; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stack { display: grid; gap: 18px; align-content: start; }
  .qr { font-size: 12.5px; color: var(--ok); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React, { useState, useEffect, useCallback, useRef } from 'https://esm.sh/react@18.3.1';
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(React.createElement);

const FIELDS = [
  ['title', 'Event title', 'full'], ['start_date', 'Date', '', 'date'], ['start_time', 'Start time', '', 'time'],
  ['end_time', 'End time', '', 'time'], ['location', 'Location', ''], ['registration_link', 'Registration link', 'full'],
];

// Downscale big phone photos in the browser before upload (faster, cheaper).
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 2400, s = Math.min(1, max / Math.max(img.width, img.height));
        if (s === 1 && /image\/(jpeg|png)/.test(file.type)) return resolve(reader.result);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.92));
      };
      img.onerror = () => reject(new Error('Could not read this image (HEIC? export it as JPEG first).'));
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r;
}

function Header({ health }) {
  const c = (ok, label) => html`<span class=${'chip ' + (ok ? 'on' : 'off')}>${ok ? '●' : '○'} ${label}</span>`;
  return html`<header>
    <svg class="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#7b1e3a"/><rect x="7" y="9" width="18" height="16" rx="2.5" fill="#fff"/><rect x="7" y="9" width="18" height="5" fill="#f3b33d"/><circle cx="12" cy="19" r="1.6" fill="#7b1e3a"/><circle cx="16" cy="19" r="1.6" fill="#7b1e3a"/></svg>
    <div><h1>EventSnap</h1><p>Snap a campus poster → event in your calendar</p></div>
    ${health && html`<div class="status">${c(health.ocrSpace, 'OCR.space')}${c(health.gemini, 'Gemini')}${c(health.qr, 'QR')}</div>`}
  </header>`;
}

function Uploader({ image, setImage, onError }) {
  const input = useRef();
  const [over, setOver] = useState(false);
  const take = async (file) => {
    if (!file || !file.type.startsWith('image/')) return onError('Please choose an image file.');
    try { setImage(await loadImage(file)); } catch (e) { onError(e.message); }
  };
  useEffect(() => {
    const onPaste = (e) => { const f = [...e.clipboardData.files].find((x) => x.type.startsWith('image/')); if (f) take(f); };
    window.addEventListener('paste', onPaste);
    return () => window.removeEventListener('paste', onPaste);
  }, []);
  return html`<div class=${'drop' + (over ? ' over' : '')}
      onClick=${() => input.current.click()}
      onDragOver=${(e) => { e.preventDefault(); setOver(true); }} onDragLeave=${() => setOver(false)}
      onDrop=${(e) => { e.preventDefault(); setOver(false); take(e.dataTransfer.files[0]); }}>
    ${image ? html`<img src=${image} alt="Uploaded poster" />`
      : html`<div class="hint"><b>Drop a poster here</b>or click to upload / take a photo · Ctrl+V to paste a screenshot</div>`}
    <input ref=${input} type="file" accept="image/*" capture="environment" hidden onChange=${(e) => take(e.target.files[0])} />
  </div>`;
}

function Review({ result, onChange }) {
  const e = result.event;
  const flagged = new Set(result.warnings.map((w) => w.field));
  const [busy, setBusy] = useState(false);
  const addGoogle = async () => {
    const { url } = await (await api('/api/gcal', { event: e })).json();
    window.open(url, '_blank', 'noopener');
  };
  const downloadIcs = async () => {
    setBusy(true);
    try {
      const blob = await (await api('/api/ics', { event: e })).blob();
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: (e.title || 'event').replace(/[^\w-]+/g, '_') + '.ics' });
      a.click();
    } finally { setBusy(false); }
  };
  return html`<div class="card">
    <h2>Review before adding</h2>
    ${result.warnings.length
      ? html`<div class="warn"><b>Please check:</b><ul>${result.warnings.map((w) => html`<li>${w.msg}</li>`)}</ul></div>`
      : html`<div class="ok">All key details found — check them and add to your calendar.</div>`}
    <div class="fields">
      ${FIELDS.map(([k, label, cls, type]) => html`<label class=${'f ' + cls + (flagged.has(k) ? ' flag' : '')}>${label}
        <input type=${type || 'text'} value=${e[k] ?? ''} onChange=${(ev) => onChange({ ...e, [k]: ev.target.value || null })} /></label>`)}
    </div>
    ${result.event?.link_source === 'qr' && html`<p class="qr">✓ Registration link decoded from the QR code</p>`}
    <div class="row" style=${{ marginTop: 16 }}>
      <button class="primary" disabled=${!e.start_date} onClick=${addGoogle}>＋ Add to Google Calendar</button>
      <button class="ghost" disabled=${!e.start_date || busy} onClick=${downloadIcs}>⬇ Download .ics</button>
      ${e.registration_link && html`<a class="btn gold" href=${e.registration_link} target="_blank" rel="noopener">Register ↗</a>`}
    </div>
    <div class="meta">
      <span>Total <b>${(result.timings.total_ms / 1000).toFixed(1)} s</b></span>
      <span>OCR <b>${(result.timings.ocr_ms / 1000).toFixed(1)} s</b></span>
      <span>Extraction <b>${(result.timings.extract_ms / 1000).toFixed(1)} s</b></span>
      ${result.thinking && html`<span>Speed <b>${SPEEDS.find((x) => x.id === result.thinking)?.name ?? result.thinking}</b></span>`}
      ${result.usage.inTokens ? html`<span>Tokens <b>${result.usage.inTokens} in / ${result.usage.outTokens} out</b></span>` : null}
      ${result.event?.confidence != null && html`<span>Model confidence <b>${Math.round(result.event.confidence * 100)}%</b></span>`}
    </div>
    <details><summary>OCR text</summary><pre>${result.ocrText}</pre></details>
    ${result.rawModelOutput && html`<details><summary>Raw model output</summary><pre>${JSON.stringify(result.rawModelOutput, null, 2)}</pre></details>`}
  </div>`;
}

const SPEEDS = [
  { id: 'minimal', name: '⚡ Fast', hint: 'minimal thinking' },
  { id: 'low', name: 'Balanced', hint: 'low thinking' },
  { id: 'high', name: 'Thorough', hint: 'full thinking' },
];

function SpeedPicker({ value, onChange, disabled }) {
  return html`<div class="label">Gemini speed</div>
    <div class="speed">${SPEEDS.map((sp) => html`<button class=${value === sp.id ? 'sel' : ''} disabled=${disabled}
      onClick=${() => onChange(sp.id)}>${sp.name}<small>${sp.hint}</small></button>`)}</div>`;
}

function NotPoster({ result, onUseAnyway }) {
  return html`<div class="card">
    <h2>Not an event poster</h2>
    <div class="warn"><b>This doesn't look like an event announcement.</b><br/>${result.notPosterReason}</div>
    <p style=${{ color: 'var(--muted)', fontSize: 13.5 }}>Try a clearer photo of the poster, or a screenshot of the event post.</p>
    <div class="row"><button class="ghost" onClick=${onUseAnyway}>Enter the details myself</button></div>
    <details><summary>OCR text</summary><pre>${result.ocrText || '(no text found)'}</pre></details>
  </div>`;
}

function App() {
  const [health, setHealth] = useState(null);
  const [image, setImage] = useState(null);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [thinking, setThinkingState] = useState(() => { try { return localStorage.getItem('eventsnap-speed'); } catch { return null; } });
  const setThinking = (v) => { setThinkingState(v); try { localStorage.setItem('eventsnap-speed', v); } catch {} };
  useEffect(() => { if (!thinking && health?.geminiThinking) setThinkingState(SPEEDS.some((x) => x.id === health.geminiThinking) ? health.geminiThinking : 'low'); }, [health]);
  const [error, setError] = useState(null);
  useEffect(() => { fetch('/api/health').then((r) => r.json()).then(setHealth).catch(() => {}); }, []);
  useEffect(() => { setResult(null); setError(null); }, [image]);

  const extract = async () => {
    setLoading(true); setError(null);
    try { setResult(await (await api('/api/extract', { image, thinking: thinking || 'low' })).json()); }
    catch (e) { setError(e.message); }
    finally { setLoading(false); }
  };

  return html`<${React.Fragment}>
    <${Header} health=${health} />
    <main>
      <div class="stack">
        <div class="card">
          <h2>1 · Poster</h2>
          <${Uploader} image=${image} setImage=${setImage} onError=${setError} />
          <p class="how">Step 1: the OCR.space engine reads the text on the poster. Step 2: Gemini turns that text into event details.</p>
          <${SpeedPicker} value=${thinking} onChange=${setThinking} disabled=${loading} />
          <div class="row">
            <button class="primary" disabled=${!image || loading} onClick=${extract}>${loading ? html`<span class="spinner"></span> Reading poster…` : 'Extract event'}</button>
          </div>
          ${error && html`<div class="err">${error}</div>`}
        </div>
      </div>
      <div class="stack">
        ${result?.notPoster ? html`<${NotPoster} result=${result} onUseAnyway=${() => setResult({ ...result, notPoster: false, event: {}, warnings: [] })} />`
          : result ? html`<${Review} result=${result} onChange=${(ev) => setResult({ ...result, event: ev })} />`
          : html`<div class="card empty"><div class="big">🗓️</div>Upload a poster photo or screenshot and press <b>Extract event</b>.<br/>You can check and edit every field before it goes into your calendar.</div>`}
      </div>
    </main>
  </${React.Fragment}>`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
